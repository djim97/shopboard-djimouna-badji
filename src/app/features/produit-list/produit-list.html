<section class="produit-list">
  <h2>Nos produits</h2>

  <div class="panier-resume">
    Panier : {{ nombreArticles() }} article(s) — Total : {{ totalFormate() }}
  </div>

  @if (produits().length === 0) {
    <p>Aucun produit disponible.</p>
  } @else {
    <div class="grille">
      @for (produit of produits(); track produit.id) {
        <app-produit-card
          [produit]="produit"
          (ajouterAuPanier)="onAjouterAuPanier($event)" />
      }
    </div>
  }
</section>
