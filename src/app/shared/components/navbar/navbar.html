<nav class="navbar">
  <p>Lien actif : {{ lienActif() }}</p>
  <a routerLink="/" [class.active]="lienActif() === 'Accueil'" (click)="changerLien('Accueil')">Accueil</a>
  <a routerLink="/produits" [class.active]="lienActif() === 'Produits'" (click)="changerLien('Produits')">Produits</a>
  <a routerLink="/panier" (click)="changerLien('Panier')">Panier</a>
  <input type="text" placeholder="Rechercher..." [value]="recherche()" (input)="onRecherche($event)" />
  <p>Recherche : {{ recherche() }}</p>
</nav>
